services:
  app:
    build: ./backend
    container_name: monar_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: monuar_db
      DB_USER: root
      DB_PASS: rootpassword
    volumes:
      - ./backend:/var/www/html
      - ./database:/var/www/database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: monar_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: monuar_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
